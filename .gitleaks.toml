title = "Sundial Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore generic-api-key false positives in archived demo logs"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)demo/midgard-node/logs/.*\.log$'''
]

[[allowlists]]
description = "Mock ed25519 private keys in midgard-manager unit/integration tests"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)demo/midgard-manager/packages/[^/]+/tests/.*\.(test|spec)\.ts$'''
]
