  - name: slo_latency_alerts
    rules:
      - alert: SLOLatencyHigh_submit_ingress_latency
        expr: 'slo:submit_ingress_latency:p95_1h > 1'
        for: 10m
        labels:
          severity: 'ticket'
          slo: 'submit_ingress_latency'
        annotations:
          summary: 'SLO submit_ingress_latency p95 latency above 1s'
          description: 'POST /submit request latency (p95 target). p95 over 1h exceeds the 1s objective.'
      - alert: SLOLatencyHigh_inclusion_latency
        expr: 'slo:inclusion_latency:p95_1h > 20'
        for: 10m
        labels:
          severity: 'ticket'
          slo: 'inclusion_latency'
        annotations:
          summary: 'SLO inclusion_latency p95 latency above 20s'
          description: 'Mempool-accepted to committed inclusion latency (commitment window span; p95 target per scalability plan). p95 over 1h exceeds the 20s objective.'
