        expr: '(1 - sum by (slo) (slo:node_availability:ratio_rate30m)) / 0.0010000000000000009'
        labels:
          slo: 'node_availability'
      - record: slo:node_availability:error_budget_remaining
        expr: 'clamp_min(1 - ((1 - sum by (slo) (slo:node_availability:ratio_rate30d)) / 0.0010000000000000009), -1)'
        labels:
          slo: 'node_availability'
