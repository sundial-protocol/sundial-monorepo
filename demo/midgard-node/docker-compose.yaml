name: sundial

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  node:
    image: sundial-node
    build:
      context: ..
      dockerfile: ./midgard-node/Dockerfile
    env_file:
      - ${NODE_ENV_FILE:-.env}
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    command:
      - node
      - ./dist/index.js
      - listen
      - --with-monitoring
    ports:
      - "${NODE_API_HOST_PORT:-3000}:3000" # api server
      - "${NODE_PROM_HOST_PORT:-9464}:9464" # prometheus exporter
      # - "4318:4318" # opentelemetry
    volumes:
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: always
    profiles:
      - monolith
    networks:
      net:

  node-tx-processor:
    image: sundial-node
    build:
      context: ..
      dockerfile: ./midgard-node/Dockerfile
    env_file:
      - ${NODE_ENV_FILE:-.env}
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    command:
      - node
      - ./dist/index.js
      - listen
      - --with-monitoring
    ports:
      - "${NODE_TX_PROCESSOR_PROM_HOST_PORT:-9466}:9464" # prometheus exporter
    environment:
      NODE_ROLE: tx-processor
      REDIS_STREAM_CONSUMER_NAME: ${REDIS_STREAM_CONSUMER_NAME_TX_PROCESSOR:-midgard-node-tx-processor}
    volumes:
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: always
    profiles:
      - split
    networks:
      net:

  node-sequencer:
    image: sundial-node
    build:
      context: ..
      dockerfile: ./midgard-node/Dockerfile
    env_file:
      - ${NODE_ENV_FILE:-.env}
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    command:
      - node
      - ./dist/index.js
      - listen
      - --with-monitoring
    ports:
      - "${NODE_SEQUENCER_PROM_HOST_PORT:-9467}:9464" # prometheus exporter
    environment:
      NODE_ROLE: sequencer
      REDIS_STREAM_CONSUMER_NAME: ${REDIS_STREAM_CONSUMER_NAME_SEQUENCER:-midgard-node-sequencer}
    volumes:
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: always
    profiles:
      - split
    networks:
      net:

  node-api:
    image: sundial-node
    build:
      context: ..
      dockerfile: ./midgard-node/Dockerfile
    env_file:
      - ${NODE_ENV_FILE:-.env}
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    command:
      - node
      - ./dist/index.js
      - listen
      - --with-monitoring
    ports:
      - "${NODE_API_HOST_PORT:-3000}:3000" # api server
      - "${NODE_PROM_HOST_PORT:-9464}:9464" # prometheus exporter
    environment:
      NODE_ROLE: api
      REDIS_STREAM_CONSUMER_NAME: ${REDIS_STREAM_CONSUMER_NAME_API:-midgard-node-api}
    volumes:
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: always
    profiles:
      - split
    networks:
      net:

  postgres:
    image: postgres:15.15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      net:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data
    networks:
      net:
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.1
    ports:
      - "9090:9090"
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging
    networks:
      net:

  loki:
    image: grafana/loki:3.6.4
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    logging: *default-logging
    networks:
      net:

  promtail:
    image: grafana/promtail:3.6.4
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      net:

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    hostname: cadvisor
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
    logging: *default-logging
    ports:
      - "8081:8080"
    networks:
      net:

  grafana:
    image: grafana/grafana:12.3.2
    user: root
    ports:
      - "3001:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml"
      - "./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json"
      - "./grafana/default.yaml:/etc/grafana/provisioning/dashboards/default.yaml"
    depends_on:
      - prometheus
      - loki
    logging: *default-logging
    networks:
      net:
  tempo-init:
    image: busybox:1.37.0
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - ./tempo-data:/var/tempo
    networks:
      net:

  tempo:
    image: grafana/tempo:2.10.0
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "14268:14268" # jaeger ingest
      - "3200:3200" # tempo
      - "9095:9095" # tempo grpc
      - "4317:4317" # otlp grpc
      - "4318:4318" # otlp http
      - "9411:9411" # zipkin
    depends_on:
      - tempo-init
    logging: *default-logging
    networks:
      net:
  node-tests:
    build:
      context: .
      additional_contexts:
        - sdk=../midgard-sdk
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "yes | pnpm test"]
    profiles:
      - test
    volumes:
      - ./:/app
      - ./db:/app/db
    depends_on:
      - postgres
    networks:
      net:
    logging: *default-logging
    environment:
      - COREPACK_EXPERIMENTAL_SKIP_ASK=true=

networks:
  net:

volumes:
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  tempo-data:
    driver: local
  redis-data:
    driver: local
