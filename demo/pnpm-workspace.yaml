  test-exclude: "^8.0.0"
  libsodium-wrappers-sumo: "0.8.4"
  libsodium-sumo: "0.8.4"
  "@cardano-sdk/core": "0.46.12"
  "@cardano-sdk/crypto": "0.4.5"
  ip-address: "10.2.0"
  pbkdf2: "3.1.5"
  sha.js: "2.4.12"
  protobufjs@7: "7.5.7"
  glob@10: "10.5.0"
  minimatch@3: "3.1.5"
  minimatch@9: "9.0.9"
  rollup@4: "4.60.3"
  esbuild: "0.28.1"
  flatted: "3.4.2"
  picomatch@2: "2.3.2"
  picomatch@4: "4.0.4"
  lodash: "4.18.1"
  brace-expansion: "5.0.8"
  ajv@6: "6.15.0"
  js-yaml: "4.3.0"
  postcss: "8.5.18"
  "@eslint/plugin-kit": "0.7.1"
  diff@4: "4.0.4"
  glob: "^13.0.6"
  uuid: "^11.1.1"
  "@effect/platform-node>ws": "8.21.0"
  "@effect/platform-node-shared>ws": "8.21.0"
  undici: ">=7.28.0"
  ws@7: "7.5.11"
  vite@6: ">=6.4.3"
  "@babel/core": ">=7.29.6"
  "@opentelemetry/core": ">=2.8.0"
  shell-quote: ">=1.9.0"

peerDependencyRules:
  allowedVersions:
    "@harmoniclabs/crypto": "0.2.5"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - cbor-extract
  - classic-level
  - esbuild
  - msgpackr-extract
  - protobufjs
