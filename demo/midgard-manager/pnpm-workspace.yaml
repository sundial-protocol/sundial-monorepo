packages:
  - 'packages/*'

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - brace-expansion
  - nanoid
trustPolicy: no-downgrade

overrides:
  ip-address: '10.3.1'
  ws: '8.21.0'
  js-yaml: '4.3.1'
  nanoid: '3.3.18'
  postcss: '8.5.23'
  brace-expansion: '5.0.9'
  esbuild: '0.28.1'
  uuid: '^11.1.1'

allowedDeprecatedVersions:
  '@effect/schema': '*'
  glob: '10.5.0'

peerDependencyRules:
  allowedVersions:
    '@harmoniclabs/crypto': '0.2.5'
