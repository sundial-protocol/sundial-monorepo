name: Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  OSV_SCANNER_VERSION: 2.3.8

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(demo/|\.github/actions/|\.github/workflows/quality\.yml)'

  # The gate below is applied per-step, not on the job. A job-level `if` skips
  # the job before the matrix is expanded, so GitHub cannot evaluate
  # `${{ matrix.name }}` and publishes a single check run literally named
  # "matrix.name". The contexts required by the `main` ruleset (Build, Lint
  # Check, Type Check, Format Check) would then never be reported at all, and
  # every PR that does not touch demo/ would sit blocked on them forever.
  # Keeping the matrix expanded lets each check report its real name and pass
  # in seconds when there is nothing to run.
  checks:
    name: ${{ matrix.name }}
    needs: detect-changes
    runs-on: ubuntu-slim
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format Check
            timeout_minutes: 20
            command: pnpm run quality:format:check:all
          - name: Lint Check
            timeout_minutes: 20
            command: pnpm run quality:lint:check:all
          - name: Type Check
            timeout_minutes: 20
            command: pnpm run quality:type:all
          - name: Build
            timeout_minutes: 30
            command: pnpm run build
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup l2 workspace
        if: needs.detect-changes.outputs.run == 'true'
        uses: ./.github/actions/setup-l2

      - name: Setup OpenTofu
        if: needs.detect-changes.outputs.run == 'true' && matrix.name == 'Format Check'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false

      - name: Run check
        if: needs.detect-changes.outputs.run == 'true'
        run: ${{ matrix.command }}
        working-directory: demo

  osv-check:
    name: OSV Check
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup l2 workspace
        uses: ./.github/actions/setup-l2

      - name: Install OSV-Scanner
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv-scanner"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run OSV check
        run: pnpm run quality:osv:check
        working-directory: demo
