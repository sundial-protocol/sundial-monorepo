name: Tests / XLong

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-xlong-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(demo/|\.github/actions/|\.github/workflows/tests-xlong\.yml)'

  # Gated per-step rather than on the job: a job-level `if` skips before the
  # matrix expands, so the required "Node Integration Tests" context would be
  # published as a single "matrix.name" check and never satisfy the `main`
  # ruleset. See quality.yml for the full rationale.
  xlong-tests:
    name: ${{ matrix.name }}
    needs: detect-changes
    runs-on: ubuntu-slim
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node Integration Tests
            timeout_minutes: 45
            command: pnpm run test:integration:node
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup l2 workspace
        if: needs.detect-changes.outputs.run == 'true'
        uses: ./.github/actions/setup-l2

      - name: Run test suite
        if: needs.detect-changes.outputs.run == 'true'
        run: ${{ matrix.command }}
        working-directory: demo
