name: Tests / XLong

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-xlong-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(demo/|\.github/actions/|\.github/workflows/tests-xlong\.yml)'

  xlong-tests:
    name: ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node Integration Tests
            timeout_minutes: 45
            command: pnpm run test:integration:node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup l2 workspace
        uses: ./.github/actions/setup-l2

      - name: Run test suite
        run: ${{ matrix.command }}
        working-directory: demo
