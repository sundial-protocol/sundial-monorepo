name: Tests / Short

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-short-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(demo/|\.github/actions/|\.github/workflows/tests-short\.yml)'

  # Gated per-step rather than on the job: a job-level `if` skips before the
  # matrix expands, so the required contexts (Node/SDK/TS Unit Tests, SDK
  # Integration Tests) would be published as a single "matrix.name" check and
  # never satisfy the `main` ruleset. See quality.yml for the full rationale.
  short-tests:
    name: ${{ matrix.name }}
    needs: detect-changes
    runs-on: ubuntu-slim
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node Unit Tests
            timeout_minutes: 20
            command: pnpm run test:unit:node
          - name: SDK Unit Tests
            timeout_minutes: 20
            command: pnpm run test:unit:sdk
          - name: TS Unit Tests
            timeout_minutes: 20
            command: pnpm run test:unit:ts
          - name: Node Coverage Tests
            timeout_minutes: 40
            command: pnpm run test:unit:coverage:node
          - name: SDK Coverage Tests
            timeout_minutes: 40
            command: pnpm run test:unit:coverage:sdk
          - name: TS Coverage Tests
            timeout_minutes: 40
            command: pnpm run test:unit:coverage:ts
          - name: SDK Integration Tests
            timeout_minutes: 30
            command: pnpm run test:integration:sdk
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup l2 workspace
        if: needs.detect-changes.outputs.run == 'true'
        uses: ./.github/actions/setup-l2

      - name: Run test suite
        if: needs.detect-changes.outputs.run == 'true'
        run: ${{ matrix.command }}
        working-directory: demo
